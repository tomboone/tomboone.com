name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The site is static, so the OpenTofu config is all there is to check. A provider bump that
  # promotes to main runs `tofu apply` in build-deploy.yml; that workflow doesn't wait on this one,
  # so the guard is the main ruleset requiring `ci` on the PR that promotes it.
  # No backend: validate and fmt need neither Azure credentials nor state.
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - run: tofu fmt -check -diff

  ci: # the one required check; the name is the contract
    if: always()
    needs: [opentofu] # every other job
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}
